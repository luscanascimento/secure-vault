name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # turbo fans each script out across api, web and shared-types.
      - name: Lint (ESLint on the API, tsc --noEmit on web + shared-types)
        run: npm run lint

      - name: Test (Jest — API crypto, tokens, CSRF, exception filter)
        run: npm test

      - name: Build (nest build + ng build)
        run: npm run build

      # A CSP that only lives in a comment is not a CSP. Fail the build if the
      # SPA's security headers ever get dropped from nginx.conf.
      - name: Assert the SPA security headers are still configured
        run: |
          conf=apps/web/nginx.conf
          for header in \
            "Content-Security-Policy" \
            "X-Content-Type-Options" \
            "X-Frame-Options" \
            "Referrer-Policy" \
            "Permissions-Policy"
          do
            count=$(grep -c "add_header $header" "$conf")
            # Once at server level, once inside the static-asset location —
            # nginx does not merge add_header across levels.
            if [ "$count" -lt 2 ]; then
              echo "::error file=$conf::$header declared $count time(s), expected >= 2"
              exit 1
            fi
          done

      - name: Validate nginx.conf syntax
        run: |
          docker run --rm \
            -v "$PWD/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --add-host api:127.0.0.1 \
            nginx:1.27-alpine nginx -t
