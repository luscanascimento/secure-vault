# Nginx config for the Angular SPA + API reverse proxy.
# Security headers are set here; the API sets its own on API responses.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for text assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Baseline security headers for the app shell.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Content-Security-Policy for the SPA. This is the one that matters: the API's
  # own CSP only covers JSON responses, which never execute anything.
  #
  #  - script-src 'self'   — no inline scripts. `optimization.styles.inlineCritical`
  #                          is off in angular.json precisely so the build stops
  #                          emitting the inline `onload="this.media='all'"`
  #                          handler that would otherwise force 'unsafe-inline'.
  #  - style-src            — 'unsafe-inline' IS required: Angular injects
  #                          component styles at runtime via
  #                          `document.createElement('style')`, and the production
  #                          build inlines the Google Fonts @font-face block into
  #                          index.html. Removing it needs a per-response nonce
  #                          (`ngCspNonce`), which a static nginx cannot mint.
  #  - connect-src 'self'   — the API is reverse-proxied under /api on this very
  #                          origin (see the location below), so no extra host.
  #  - font-src             — fonts.gstatic.com, where the inlined @font-face
  #                          rules fetch the woff2 files from.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;

  # Reverse-proxy API calls to the NestJS service (same-origin => tidy cookies).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
  }

  # Long-cache hashed static assets.
  #
  # nginx `add_header` does NOT merge across levels: a single add_header here
  # discards every add_header inherited from `server`. So the security headers
  # are repeated verbatim, otherwise .js/.css would ship with none of them.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
